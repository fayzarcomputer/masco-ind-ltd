<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100" height="100">
  <g fill="#003399">
    <!-- 8-pointed geometric diamond flower pattern of Masco -->
    <!-- Center diamond -->
    <polygon points="80,68 92,80 80,92 68,80" fill="#ffffff" />
    
    <!-- Outer Petals / Chevrons -->
    <!-- Top -->
    <polygon points="80,18 95,45 80,60 65,45" />
    <!-- Bottom -->
    <polygon points="80,142 95,115 80,100 65,115" />
    <!-- Left -->
    <polygon points="18,80 45,65 60,80 45,95" />
    <!-- Right -->
    <polygon points="142,80 115,65 100,80 115,95" />
    <!-- Top-Right -->
    <polygon points="124,36 122,70 102,62 108,42" />
    <!-- Top-Left -->
    <polygon points="36,36 38,70 58,62 52,42" />
    <!-- Bottom-Right -->
    <polygon points="124,124 122,90 102,98 108,118" />
    <!-- Bottom-Left -->
    <polygon points="36,124 38,90 58,98 52,118" />
    
    <!-- Small accent triangles -->
    <polygon points="80,35 88,48 72,48" fill="#ffffff" />
    <polygon points="80,125 88,112 72,112" fill="#ffffff" />
    <polygon points="35,80 48,72 48,88" fill="#ffffff" />
    <polygon points="125,80 112,72 112,88" fill="#ffffff" />
  </g>
  <!-- Masco Name Box -->
  <rect x="25" y="136" width="110" height="24" rx="2" fill="#003399" />
  <text x="80" y="153" font-family="'Arial Black', Impact, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">MASCO</text>
</svg>
