<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Export Invoice Autofill</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { width: 340px; padding: 14px; background: #f8fafc; color: #1e293b; font-size: 13px; }
    .header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; border-bottom: 1px solid #e2e8f0; padding-bottom: 8px; }
    .header h2 { font-size: 14px; font-weight: 700; color: #1e3a8a; }
    .badge { background: #dbeafe; color: #1e40af; font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: 600; }
    .form-group { margin-bottom: 10px; }
    label { display: block; font-size: 11px; font-weight: 600; color: #475569; margin-bottom: 4px; }
    input, select { width: 100%; padding: 7px 9px; font-size: 12px; border: 1px solid #cbd5e1; border-radius: 5px; outline: none; background: #fff; }
    input:focus, select:focus { border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.15); }
    .btn { width: 100%; padding: 8px; background: #1e3a8a; color: #fff; border: none; border-radius: 5px; font-weight: 600; font-size: 12px; cursor: pointer; transition: background 0.2s; margin-top: 4px; }
    .btn:hover { background: #1d4ed8; }
    .btn-success { background: #10b981; }
    .btn-success:hover { background: #059669; }
    .status { margin-top: 10px; padding: 8px; border-radius: 4px; font-size: 11px; display: none; line-height: 1.4; }
    .status.success { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; display: block; }
    .status.error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; display: block; }
    .status.info { background: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd; display: block; }
    .footer { margin-top: 10px; font-size: 10px; text-align: center; color: #94a3b8; }
    .link { color: #3b82f6; text-decoration: none; cursor: pointer; }
  </style>
</head>
<body>
  <div class="header">
    <span style="font-size: 18px;">⚡</span>
    <div>
      <h2>FAYZAR PORTAL AUTOFILL</h2>
      <span class="badge">Garments Export V1.0</span>
    </div>
  </div>

  <div class="form-group">
    <label for="apiServer">API Server URL:</label>
    <input type="text" id="apiServer" value="http://localhost:5000">
  </div>

  <div class="form-group">
    <label for="invoiceIdInput">Invoice ID or Invoice No:</label>
    <input type="text" id="invoiceIdInput" placeholder="Paste UUID or MIL/MS/1205/2026">
  </div>

  <div class="form-group">
    <label for="recentInvoicesSelect">Or Choose from Recent Invoices:</label>
    <select id="recentInvoicesSelect">
      <option value="">-- Load recent from server --</option>
    </select>
  </div>

  <button id="btnAutofill" class="btn btn-success">⚡ Autofill Active Webpage</button>

  <div id="statusBox" class="status"></div>

  <div class="footer">
    Works on Bangladesh Bank EXP, Customs & Buyer Portals.<br>
    <a href="http://localhost:5000/extension/portal-test.html" target="_blank" class="link">Open Test Portal</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
